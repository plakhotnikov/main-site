services:
  web:
    build: .
    container_name: main-site-web
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
    depends_on:
      - db
      - mailpit
  db:
    image: mysql:8.0
    container_name: main-site-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: main_site
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./Consulting_Plakhotnikov/db:/docker-entrypoint-initdb.d:ro
  mailpit:
    image: axllent/mailpit
    container_name: main-site-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
