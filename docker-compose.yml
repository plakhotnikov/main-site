services:
  web:
    image: php:8.2-apache
    container_name: main-site-web
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: main-site-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: main_site
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
